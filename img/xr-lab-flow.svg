<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6c5cff"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eceaf6"/><stop offset="1" stop-color="#f7f6fd"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="86" font-size="44" font-weight="800" fill="#17133a">Digital Skills Lab: interaction flow</text>
  <text x="70" y="126" font-size="24" fill="#5d5884">One input model everywhere: point (mouse, touch or controller ray) and select.</text>

  <!-- Entry -->
  <g><rect x="70" y="380" width="230" height="110" rx="26" fill="#17133a"/><text x="185" y="428" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">Enter</text><text x="185" y="462" text-anchor="middle" font-size="20" fill="#c4bfee">desktop, phone, VR or AR</text></g>
  <path d="M300 435H400" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>

  <!-- Hub -->
  <g><rect x="400" y="350" width="270" height="170" rx="30" fill="#fff" stroke="#6c5cff" stroke-width="4"/><text x="535" y="414" text-anchor="middle" font-size="32" font-weight="800" fill="#17133a">Lab hub</text><text x="535" y="452" text-anchor="middle" font-size="21" fill="#5d5884">choose a mission</text><text x="535" y="484" text-anchor="middle" font-size="21" fill="#5d5884">see progress</text></g>

  <!-- Mission 1 -->
  <path d="M670 400C740 300 760 230 830 230" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="830" y="170" width="190" height="120" rx="24" fill="#ffe3e8" stroke="#ff6b81" stroke-width="3"/><text x="925" y="218" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Mission 1</text><text x="925" y="250" text-anchor="middle" font-size="21" fill="#5d5884">Read an email</text></g>
  <path d="M1020 230H1080" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="1080" y="170" width="190" height="120" rx="24" fill="#ffe3e8" stroke="#ff6b81" stroke-width="3"/><text x="1175" y="218" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Decide</text><text x="1175" y="250" text-anchor="middle" font-size="21" fill="#5d5884">safe or phishing</text></g>
  <path d="M1270 230H1330" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="1330" y="170" width="200" height="120" rx="24" fill="#ffe3e8" stroke="#ff6b81" stroke-width="3"/><text x="1430" y="218" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Feedback</text><text x="1430" y="250" text-anchor="middle" font-size="21" fill="#5d5884">why it is, or is not</text></g>
  <path d="M1430 170C1430 120 1175 120 1175 120C925 120 925 150 925 170" stroke="#ff6b81" stroke-width="3" stroke-dasharray="9 9" fill="none" marker-end="url(#a)"/>
  <text x="1175" y="108" text-anchor="middle" font-size="20" fill="#5d5884">repeat for 4 emails; 3 correct completes the mission</text>

  <!-- Mission 2 -->
  <path d="M670 435H830" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="830" y="375" width="190" height="120" rx="24" fill="#d9f7f2" stroke="#12b8a6" stroke-width="3"/><text x="925" y="423" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Mission 2</text><text x="925" y="455" text-anchor="middle" font-size="21" fill="#5d5884">Tap character tiles</text></g>
  <path d="M1020 435H1080" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="1080" y="375" width="190" height="120" rx="24" fill="#d9f7f2" stroke="#12b8a6" stroke-width="3"/><text x="1175" y="423" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Live checks</text><text x="1175" y="455" text-anchor="middle" font-size="21" fill="#5d5884">meter and 5 rules</text></g>
  <path d="M1270 435H1330" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="1330" y="375" width="200" height="120" rx="24" fill="#d9f7f2" stroke="#12b8a6" stroke-width="3"/><text x="1430" y="423" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Finish</text><text x="1430" y="455" text-anchor="middle" font-size="21" fill="#5d5884">when all rules pass</text></g>

  <!-- Mission 3 -->
  <path d="M670 470C740 570 760 665 830 665" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="830" y="605" width="190" height="120" rx="24" fill="#ece5ff" stroke="#a78bfa" stroke-width="3"/><text x="925" y="653" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Mission 3</text><text x="925" y="685" text-anchor="middle" font-size="21" fill="#5d5884">Pick a file</text></g>
  <path d="M1020 665H1080" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="1080" y="605" width="190" height="120" rx="24" fill="#ece5ff" stroke="#a78bfa" stroke-width="3"/><text x="1175" y="653" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Pick a folder</text><text x="1175" y="685" text-anchor="middle" font-size="21" fill="#5d5884">match the file type</text></g>
  <path d="M1270 665H1330" stroke="#6c5cff" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g><rect x="1330" y="605" width="200" height="120" rx="24" fill="#ece5ff" stroke="#a78bfa" stroke-width="3"/><text x="1430" y="653" text-anchor="middle" font-size="25" font-weight="800" fill="#17133a">Feedback</text><text x="1430" y="685" text-anchor="middle" font-size="21" fill="#5d5884">6 files sorted = done</text></g>

  <!-- Return + badge -->
  <path d="M1430 725C1430 800 535 800 535 520" stroke="#6c5cff" stroke-width="4" stroke-dasharray="10 10" fill="none" marker-end="url(#a)"/>
  <text x="980" y="838" text-anchor="middle" font-size="22" fill="#5d5884">Back to lab after every mission. Finish all three to earn the Digital Skills Starter badge.</text>
</svg>
